name: release

# Three ways in:
#   * push to master    - the normal path. Bumps the patch, builds, tags, releases.
#   * push a v* tag     - the manual path, kept for cutting a specific version by hand.
#                         The tag must already match __version__; nothing is rewritten.
#   * workflow_dispatch - dry run. Builds and uploads the artifact, tags nothing.
#
# To push to master WITHOUT releasing, put [skip ci] in the commit message - GitHub
# skips the whole workflow run.
on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write        # required to push the bump commit, the tag, and the release

# Two pushes landing together must not race for the same version number. Queue them
# rather than cancelling: a cancelled run could leave a tag pushed with no release.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    # MUST be Windows: PyInstaller emits a native binary, and the whole app is
    # Windows-only anyway (ViGEmBus is a Windows kernel driver).
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and, more to the point, every tag - the bump walks the tag
          # list to find a free version number.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"     # 3.11+ required: the 1kHz pacer needs a
                                     # high-resolution time.sleep on Windows

      # Works out what version this run ships and, on the auto path, rewrites
      # __version__ in the working tree. Nothing is committed here - the bump is only
      # pushed once the build and smoke test have actually passed, so a failed build
      # leaves master untouched.
      - name: Decide version
        id: ver
        run: |
          $src = 'src/pyESS_app.py'
          $raw = Get-Content $src -Raw
          if ($raw -notmatch '(?m)^__version__\s*=\s*"(\d+)\.(\d+)\.(\d+)"') {
            Write-Error "no parsable __version__ in $src"
            exit 1
          }
          $maj = [int]$Matches[1]; $min = [int]$Matches[2]; $pat = [int]$Matches[3]
          $cur = "$maj.$min.$pat"

          # event_name is tested FIRST, before ref_type. The Run workflow ref dropdown
          # lists tags as well as branches, so a dispatch aimed at v1.0.1 has
          # ref_type = tag - and testing ref_type first sent that down the RELEASE path,
          # overwriting a published release's notes (losing its generated changelog) and
          # clobbering its asset, from a run this file documents as tagging nothing.
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            # Dry run: build what is here, ship nothing.
            $ver = $cur
            "bump=false"    >> $env:GITHUB_OUTPUT
            "release=false" >> $env:GITHUB_OUTPUT
          }
          elseif ("${{ github.ref_type }}" -eq "tag") {
            # Manual path. Fail loudly if the tag and __version__ disagree - otherwise
            # you ship v1.1.0 containing a binary that reports 1.0.0.
            $ver = "${{ github.ref_name }}" -replace '^v', ''
            if ($ver -ne $cur) {
              Write-Error "Tag $ver does not match __version__ $cur - bump src/pyESS_app.py"
              exit 1
            }
            "bump=false"   >> $env:GITHUB_OUTPUT
            "release=true" >> $env:GITHUB_OUTPUT
          }
          else {
            # Auto path. Start at patch+1 and keep walking until the tag is free, so a
            # re-run - or a __version__ that has drifted behind the tags - still lands
            # on something unused instead of colliding.
            do {
              $pat++
              $ver = "$maj.$min.$pat"
              $taken = git tag -l "v$ver"
            } while (-not [string]::IsNullOrEmpty($taken))

            # Rewrite in place via .NET so the existing line endings and encoding
            # survive untouched. Anchored and counted: the detector reports only the
            # FIRST match while -replace rewrites every column-0 occurrence, so assert
            # there is exactly one before touching the file.
            $hits = ([regex]'(?m)^__version__\s*=\s*"[^"]*"').Matches($raw).Count
            if ($hits -ne 1) {
              Write-Error "expected exactly one __version__ line in $src, found $hits"
              exit 1
            }
            $new = '__version__ = "' + $ver + '"'
            $raw = $raw -replace '(?m)^__version__\s*=\s*"[^"]*"', $new
            [System.IO.File]::WriteAllText((Resolve-Path $src), $raw)
            Write-Host "bumping $cur -> $ver"
            "bump=true"    >> $env:GITHUB_OUTPUT
            "release=true" >> $env:GITHUB_OUTPUT
          }
          "version=$ver" >> $env:GITHUB_OUTPUT
          "zip=pyESS-$ver-win64.zip" >> $env:GITHUB_OUTPUT
          Write-Host "this run ships $ver"

      # vgamepad is source-only on PyPI (no wheels, any version), so pip must run its
      # setup.py - and that setup.py launches the ViGEmBus MSI via `msiexec /i`, an
      # INTERACTIVE GUI, whenever it cannot find the driver in the registry. On a runner
      # nobody clicks Next, so the install hangs forever at "Preparing metadata". Older
      # pip dodged it because setup.py skips the installer for `egg_info`; modern pip
      # prepares metadata with `dist_info`, which is not in that skip list.
      #
      # Its detection is a plain string search over `reg query ...\Uninstall /s`, so
      # seeding that key is enough to make it skip the installer. Safe here because CI
      # never creates a virtual pad: --selftest imports neither pygame nor vgamepad
      # (both are imported lazily in the input loop) and the build only needs the
      # ViGEmClient.dll shipped inside the package. Real users still install the real
      # driver - the release notes tell them to.
      - name: Stub the ViGEmBus registry entry
        run: |
          $key = "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\ViGEmBus"
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name DisplayName -PropertyType String -Force `
            -Value "Nefarius Virtual Gamepad Emulation Bus Driver" | Out-Null
          New-ItemProperty -Path $key -Name DisplayVersion -PropertyType String -Force `
            -Value "1.17.333.0" | Out-Null
          Write-Host "seeded $key so vgamepad's setup.py skips its interactive installer"

      - name: Install dependencies
        # A hang here used to sit until the job limit; fail in minutes instead.
        timeout-minutes: 10
        run: |
          # Each command checked. A pwsh step reports only the LAST exit code, so a
          # failed requirements install used to pass green - and nothing downstream
          # caught it: selftest imports neither pygame nor vgamepad, and
          # collect_dynamic_libs returns [] for a missing package instead of raising.
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw "pip self-upgrade failed" }
          pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "requirements install failed" }
          pip install pyinstaller==6.21.0
          if ($LASTEXITCODE -ne 0) { throw "pyinstaller install failed" }
          # Check the native payload WITHOUT importing vgamepad. Its __init__ calls
          # vigem_connect() at module scope, which needs the real ViGEmBus driver, so
          # `import vgamepad` can NEVER succeed on a runner - it dies with
          # VIGEM_ERROR_BUS_NOT_FOUND. find_spec locates the package without executing
          # it, and ViGEmClient.dll is precisely what collect_dynamic_libs() bundles:
          # if that file moves in a future vgamepad, the build would otherwise ship an
          # exe that throws the moment a user clicks Start.
          python -c "import importlib.util,pathlib,sys; s=importlib.util.find_spec('vgamepad'); p=pathlib.Path(s.submodule_search_locations[0])/'win'/'vigem'/'client'/'x64'/'ViGEmClient.dll'; print('ViGEmClient.dll present:', p.is_file()); sys.exit(0 if p.is_file() else 1)"
          if ($LASTEXITCODE -ne 0) { throw "vgamepad payload check failed - ViGEmClient.dll not where the spec expects it" }
          python -c "import pygame; print('pygame', pygame.version.ver)"
          if ($LASTEXITCODE -ne 0) { throw "pygame import failed" }

      # The gate. Needs no controller and no display: it exercises the shaping and
      # the VC inversion and asserts the two targets still agree.
      - name: Selftest
        run: python src/pyESS_app.py --selftest

      - name: Build
        run: python -m PyInstaller --noconfirm --clean packaging/pyESS.spec

      # These belong BESIDE the exe, not in _internal/: the GPL text has to be
      # visible, and pyESS_zones.json must land where the frozen app looks for it.
      - name: Stage top-level files
        run: |
          Copy-Item LICENSE, README.md, pyESS_zones.json, docs/pyess.ico dist/pyESS/

      # Also confirms the bump actually reached the binary: if the rewrite silently
      # missed, the exe reports the old number and this stops the release.
      - name: Smoke-test the built exe
        run: |
          # packaging/pyESS.spec sets console=False, so this is a GUI-subsystem exe.
          # Called directly, pwsh captures NOTHING (the result is an empty Object[],
          # so `-ne` becomes an array filter that is always falsy) and never waits, so
          # $LASTEXITCODE is never even set. Both assertions here used to be inert:
          # verified against a deliberately wrong version, the check did not fire.
          # Start-Process -Wait -PassThru with redirected output is the only form that
          # yields a real exit code and real stdout from a windowed binary.
          $exe = "dist/pyESS/pyESS.exe"
          function RunExe([string[]]$argv, [string]$tag) {
            $o = "$env:RUNNER_TEMP/$tag.out"; $e = "$env:RUNNER_TEMP/$tag.err"
            $p = Start-Process -FilePath $exe -ArgumentList $argv -Wait -PassThru `
                   -NoNewWindow -RedirectStandardOutput $o -RedirectStandardError $e
            $text = if (Test-Path $o) { (Get-Content $o -Raw) } else { "" }
            if (Test-Path $e) { $err = (Get-Content $e -Raw); if ($err) { Write-Host $err } }
            return [pscustomobject]@{ Code = $p.ExitCode; Out = "$text" }
          }

          $want = "${{ steps.ver.outputs.version }}"
          $v = RunExe @("--version") "ver"
          $got = ($v.Out -replace '^pyESS ', '').Trim()
          Write-Host "exe reports '$got' (exit $($v.Code)), expected '$want'"
          if ($v.Code -ne 0) { throw "built exe --version exited $($v.Code)" }
          if ($got -ne $want) { throw "built exe reports '$got', not '$want'" }

          $t = RunExe @("--selftest") "selftest"
          Write-Host $t.Out
          if ($t.Code -ne 0) { throw "built exe --selftest exited $($t.Code)" }
          Write-Host "smoke test passed against the built binary"

      - name: Package
        run: Compress-Archive -Path dist/pyESS/* -DestinationPath "${{ steps.ver.outputs.zip }}" -Force

      # Always keep the build, even on a dry run that tags nothing.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ver.outputs.zip }}
          path: ${{ steps.ver.outputs.zip }}

      # Only now, with a binary that built, ran and reported the right version, does
      # anything get written back. [skip ci] keeps ci.yml off the bump commit; the push
      # itself cannot re-trigger this workflow because pushes authored with
      # GITHUB_TOKEN do not raise workflow events.
      - name: Commit, tag and push the bump
        if: steps.ver.outputs.bump == 'true'
        run: |
          $ErrorActionPreference = 'Stop'
          # A pwsh step only reports the LAST command's exit code, so an unchecked git
          # failure mid-block passes green. That is exactly how a failed push once left
          # the tag on the wrong commit - every command below is checked.
          function Run([string]$what, [scriptblock]$cmd) {
            & $cmd
            if ($LASTEXITCODE -ne 0) { throw "$what failed (exit $LASTEXITCODE)" }
          }
          $tag = "v${{ steps.ver.outputs.version }}"
          Run "git config name"  { git config user.name  "github-actions[bot]" }
          Run "git config email" { git config user.email "41898282+github-actions[bot]@users.noreply.github.com" }
          Run "git add"          { git add src/pyESS_app.py }

          # Nothing staged means the __version__ rewrite silently did not take. Stop:
          # tagging here would put the tag on the unbumped commit.
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            throw "nothing staged - the __version__ rewrite did not change the file"
          }

          Run "git commit" { git commit -m "release $tag [skip ci]" }
          Run "git tag"    { git tag $tag }
          # --atomic: branch and tag land together or not at all. Without it a rejected
          # branch push still leaves a published tag pointing at unbumped source.
          Run "git push"   { git push --atomic origin HEAD:master "refs/tags/$tag" }
          Write-Host "pushed $tag and the bump commit"

      # Idempotent on purpose. `gh release create` FAILS if the release already exists,
      # which it will if the tag was released from the web UI first, or if this job is
      # re-run. So: create only when missing, then upload with --clobber either way.
      - name: Create or update release
        if: steps.ver.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @"
          ## Install

          1. Download and extract ``${{ steps.ver.outputs.zip }}``
          2. **Install [ViGEmBus](https://github.com/nefarius/ViGEmBus/releases)** - required.
             It is a kernel driver and cannot be bundled; without it the app cannot create
             the virtual controller.
          3. Optionally install [HidHide](https://github.com/nefarius/HidHide/releases) so
             games bind only the virtual pad. Whitelist ``pyESS.exe`` **before** hiding your
             controller, or the app loses access to it too.
          4. Run ``pyESS.exe``

          No Python installation needed.

          ## Licence
          GPLv3 - see LICENSE in the archive. Contains code from
          [Skuzee/ESS-Adapter](https://github.com/Skuzee/ESS-Adapter).
          "@
          $notes | Out-File -FilePath notes.md -Encoding utf8
          $tag = "v${{ steps.ver.outputs.version }}"

          # `gh release create` CREATES the tag at the default branch head when it is
          # missing. That is how a release once got published against unbumped source.
          # Require the tag to already be on origin.
          if ([string]::IsNullOrWhiteSpace((git ls-remote --tags origin "refs/tags/$tag"))) {
            Write-Error "$tag is not on origin - refusing to create a release that would invent it"
            exit 1
          }

          # Retry every gh call. The tag and bump commit are already pushed by now, so a
          # transient 5xx here strands a version with no release - and a re-run cannot
          # repair it: it replays the ORIGINAL trigger SHA, reads the pre-bump
          # __version__, sees this tag taken, picks the NEXT number, then fails its own
          # push as non-fast-forward. The orphan is then permanent and manual to fix.
          # Retrying does not close that window, but it removes its commonest cause.
          function Gh([string[]]$argv, [string]$what) {
            for ($i = 1; $i -le 3; $i++) {
              & gh @argv
              if ($LASTEXITCODE -eq 0) { return }
              if ($i -lt 3) {
                Write-Host "  $what failed (exit $LASTEXITCODE) - retry $i/3"
                Start-Sleep -Seconds (5 * $i)
              }
            }
            throw "$what failed after 3 attempts - tag $tag is published with no release; " +
                  "create it by hand rather than re-running, which would pick a new version"
          }

          $title = "pyESS ${{ steps.ver.outputs.version }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "creating release $tag"
            # --prerelease: the pipeline never publishes a final release. It stays
            # flagged (and off "Latest") until a human promotes it - see the comment
            # on the update branch below for why we never re-apply this on a re-run.
            Gh @("release", "create", $tag, "--title", $title,
                 "--notes-file", "notes.md", "--generate-notes", "--prerelease") "release create"
          } else {
            # Deliberately NO --prerelease here. If you have already promoted this
            # release by hand, a re-run must not silently demote it back.
            Write-Host "release $tag already exists - updating notes, leaving its"
            Write-Host "  pre-release flag exactly as you left it"
            Gh @("release", "edit", $tag, "--title", $title,
                 "--notes-file", "notes.md") "release edit"
          }

          # --clobber so a re-run replaces the asset instead of erroring on a duplicate
          Gh @("release", "upload", $tag, "${{ steps.ver.outputs.zip }}", "--clobber") "release upload"
          Write-Host "uploaded ${{ steps.ver.outputs.zip }}"
          Write-Host "$tag is a PRE-RELEASE - promote it when you are ready:"
          Write-Host "  gh release edit $tag --prerelease=false --latest"
